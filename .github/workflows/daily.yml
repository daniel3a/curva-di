name: Coletar curva B3

on:
  schedule:
    # Brasil nao tem horario de verao: BRT = UTC-3 o ano todo.
    - cron: "15 23 * * 1-5"   # ~20:15 BRT, seg-sex (apos o fechamento da B3)
    - cron: "15 11 * * 2-6"   # ~08:15 BRT do dia seguinte (rede de seguranca)
  workflow_dispatch: {}         # botao "Run workflow" na aba Actions

permissions:
  contents: write

concurrency:
  group: coleta-curva
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rodar coletor
        working-directory: collector
        run: python update.py

      - name: Commitar dados novos
        run: |
          git config user.name  "curva-di bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Nada novo hoje."
          else
            git commit -m "curva: dados de $(date -u +%F)"
            git push
          fi
